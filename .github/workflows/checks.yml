name: Verificar y publicar Taller Calamante
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: taller-calamante-web
          path: dist
      - name: Preparar sitio de GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages para publicar desde GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                ...context.repo,
                build_type: 'workflow'
              });
            } catch (error) {
              core.warning(`No se pudo cambiar el origen de Pages (${error.status}): ${error.message}. Si falla el despliegue, elegir Settings > Pages > Source > GitHub Actions y volver a ejecutar este workflow.`);
            }
      - name: Comprobar configuración de Pages
        uses: actions/configure-pages@v5
      - name: Publicar la versión compilada
        id: deployment
        uses: actions/deploy-pages@v4
