name: Verificar y publicar Taller Calamante
on:
  push:
    branches: [main, 'quality-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    concurrency:
      group: verificar-web-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:server
      - run: npm test
      - name: Reutilizar navegador de pruebas
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu24-${{ hashFiles('package-lock.json') }}
      # Ubuntu 24.04 alojado ya incluye las bibliotecas de Chrome.
      # Descargar solo el navegador de Playwright evita reinstalar paquetes del sistema.
      - run: npx playwright install --only-shell chromium
        timeout-minutes: 5
      - run: npm run test:e2e
      - run: npm run test:server
      - run: npm run test:publication
      - run: npm run test:offline
      - name: Conservar diagnóstico de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-navegador
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: taller-calamante-web
          path: dist
      - name: Preparar sitio de GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.pages_source.outputs.url }}
    steps:
      - name: Consultar el origen de GitHub Pages
        id: pages_source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            const fromActions = data.build_type === 'workflow';
            core.setOutput('actions', String(fromActions));
            core.setOutput('url', data.html_url);
            if (!fromActions) {
              core.notice('Pages usa publicación desde una rama. La compilación de main se publica mediante el despliegue nativo de Pages; se conserva esa configuración.');
            }
      - name: Comprobar configuración de Pages
        if: steps.pages_source.outputs.actions == 'true'
        uses: actions/configure-pages@v5
      - name: Publicar la versión compilada
        if: steps.pages_source.outputs.actions == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
